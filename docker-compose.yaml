services:
  bot:
    build: .
    container_name: natk-schedule-bot
    environment:
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN}
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    networks:
      - my-network
    depends_on:
      - postgres

  postgres:
    image: postgres:16.9
    container_name: postgres-natk
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    networks:
      - my-network
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  pg_data:

networks:
  my-network:
    driver: bridge
